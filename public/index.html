<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent-work</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <h1 class="title"><span aria-hidden="true">👀</span> 我的團隊在做什麼</h1>
    <div class="pills" aria-live="polite">
      <span class="pill" data-kind="needs"><i></i>需要你 <b id="cNeeds">0</b></span>
      <span class="pill" data-kind="working"><i></i>工作中 <b id="cWorking">0</b></span>
      <span class="pill" data-kind="finished"><i></i>已完成 <b id="cFinished">0</b></span>
    </div>
    <div class="spacer"></div>
    <div class="seg">
      <button id="stopBtn" disabled>■ 停止</button>
      <button id="resetBtn">＋ 新對話</button>
    </div>
    <button id="themeBtn" class="icon-btn" title="切換深色／淺色">◐</button>
  </header>

  <main class="stage">
    <section class="office-wrap">
      <canvas id="office" aria-label="辦公室：團隊的即時狀態"></canvas>
      <div class="legend" id="legend">
        <span><i style="background:#8f7bc0"></i>思考</span>
        <span><i style="background:#5b86a8"></i>執行工具</span>
        <span><i style="background:#5f9474"></i>撰寫</span>
        <span><i style="background:#c98a3a"></i>等你</span>
        <span><i style="background:#6f9358"></i>完成</span>
      </div>
      <div class="version" id="version"></div>
      <button class="panel-tab" id="panelTab" title="展開面板">‹ 面板</button>
    </section>

    <aside class="panel" id="panel">
      <div class="panel-head">
        <span class="group-label">工作團隊</span>
        <span class="usage-total" id="usageTotal"></span>
        <button class="icon-btn" id="panelClose" title="收起面板">›</button>
      </div>

      <div class="cards" id="cards"></div>

      <div class="filters" id="filters" role="tablist" aria-label="篩選時間軸">
        <button class="chip on" data-filter="all">全部</button>
      </div>

      <div class="log" id="log" data-filter="all">
        <div class="empty" id="empty">
          <p>把任務交給<strong>矮子</strong>，他會拆解工作、交派給<strong>阿關</strong>和<strong>小雅</strong>，最後彙整回報。試試：</p>
          <button class="example">我們下個月要推出一款環保保溫杯，請規劃上市宣傳：新聞稿和社群貼文</button>
          <button class="example">週末要在市集辦快閃店，請準備媒體邀請函和三則 IG 貼文</button>
          <button class="example">看看工作資料夾裡有什麼，幫我整理一份進度報告</button>
        </div>
      </div>

      <form class="composer" id="composer">
        <textarea id="input" rows="2" placeholder="交代任務給矮子…（Enter 送出，Shift+Enter 換行）"></textarea>
        <button type="submit" id="sendBtn">送出</button>
      </form>
    </aside>
  </main>

  <div class="tooltip" id="tooltip" hidden></div>
  <script src="office.js"></script>
  <script src="app.js"></script>
</body>
</html>
