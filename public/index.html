<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent-work</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <h1 class="title"><span aria-hidden="true">👀</span> 我的 Agent 在做什麼</h1>
    <div class="pills" aria-live="polite">
      <span class="pill" data-kind="needs"><i></i>需要你 <b id="cNeeds">0</b></span>
      <span class="pill" data-kind="working"><i></i>工作中 <b id="cWorking">0</b></span>
      <span class="pill" data-kind="finished"><i></i>已完成 <b id="cFinished">0</b></span>
    </div>
    <div class="spacer"></div>
    <div class="seg">
      <button id="stopBtn" disabled>■ 停止</button>
      <button id="resetBtn">＋ 新對話</button>
    </div>
    <button id="themeBtn" class="icon-btn" title="切換深色／淺色">◐</button>
  </header>

  <main class="stage">
    <section class="office-wrap">
      <canvas id="office" aria-label="辦公室：Agent 的即時狀態"></canvas>
      <div class="legend" id="legend">
        <span><i style="background:#8b6be6"></i>思考</span>
        <span><i style="background:#3b8ee0"></i>執行工具</span>
        <span><i style="background:#22a874"></i>撰寫</span>
        <span><i style="background:#e09412"></i>等你</span>
        <span><i style="background:#5f9a4c"></i>完成</span>
      </div>
      <div class="version" id="version"></div>
      <button class="panel-tab" id="panelTab" title="展開面板">‹ 面板</button>
    </section>

    <aside class="panel" id="panel">
      <div class="panel-head">
        <span class="group-label" id="groupLabel">閒置</span>
        <button class="icon-btn" id="panelClose" title="收起面板">›</button>
      </div>

      <article class="card" id="card">
        <div class="card-top">
          <span class="badge">Claude</span>
          <strong class="card-name">Agent-work</strong>
          <span class="card-time" id="timer"></span>
        </div>
        <div class="card-task" id="task">還沒有任務</div>
        <div class="card-status" id="statusLine">
          <span class="st-icon" id="stIcon">–</span>
          <span class="st-label" id="statusText">閒置中</span>
          <code class="st-detail" id="statusDetail"></code>
        </div>
        <div class="card-reply" id="lastReply"></div>
        <div class="card-foot">
          <span id="modelInfo"></span>
          <span class="usage" id="usage">0 tokens · 0 個工具</span>
        </div>
      </article>

      <div class="log" id="log">
        <div class="empty" id="empty">
          <p>給它一個任務，它會自己規劃步驟、使用工具完成。試試：</p>
          <button class="example">寫一個 Python 程式計算 1 到 100 的質數，執行它並告訴我結果</button>
          <button class="example">搜尋 AI Agent 的最新發展，整理成 notes.md</button>
          <button class="example">看看工作資料夾裡有什麼，幫我寫一份 README</button>
        </div>
      </div>

      <form class="composer" id="composer">
        <textarea id="input" rows="2" placeholder="輸入任務…（Enter 送出，Shift+Enter 換行）"></textarea>
        <button type="submit" id="sendBtn">送出</button>
      </form>
    </aside>
  </main>

  <div class="tooltip" id="tooltip" hidden></div>
  <script src="office.js"></script>
  <script src="app.js"></script>
</body>
</html>
